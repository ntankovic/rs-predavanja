t="700" fill="#18344b">Kontejner</text><text x="760" y="196" text-anchor="start" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#546573">izolirani procesi; isto računalo</text><text x="760" y="240" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#18344b">Računalo</text><text x="760" y="266" text-anchor="start" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#546573">struja, disk, jezgra OS-a</text><text x="760" y="310" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#18344b">Podatkovni centar</text><text x="760" y="336" text-anchor="start" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#546573">mreža, napajanje, hlađenje</text><path d="M 1090 90 L 1090 360" fill="none" stroke="#546573" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/><text x="930" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#546573">Što je granica šira:</text><text x="930" y="424" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#546573">neovisniji ispadi, skuplja komunikacija</text></svg>