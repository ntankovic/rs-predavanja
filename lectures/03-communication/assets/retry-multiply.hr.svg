<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="340" viewBox="0 0 1120 340"><defs><marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto"><path d="M2,2 L18,9 L2,16 Z" fill="#3886ad"/></marker><marker id="arrow-red" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto"><path d="M2,2 L18,9 L2,16 Z" fill="#b33e44"/></marker><marker id="arrow-orange" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto"><path d="M2,2 L18,9 L2,16 Z" fill="#b56a21"/></marker><marker id="arrow-gray" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto"><path d="M2,2 L18,9 L2,16 Z" fill="#546573"/></marker><marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto"><path d="M2,2 L18,9 L2,16 Z" fill="#3d7f4f"/></marker></defs><rect width="1120" height="340" fill="white"/><text x="560" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#18344b">Svaki sloj ponavlja do 3 puta (4 pokušaja) i ne zna za ostale.</text><rect x="21" y="75" width="238" height="100" rx="14" fill="#24445c" opacity=".035"/><rect x="20" y="70" width="240" height="100" rx="14" fill="#f8fbfd" stroke="#c6dbe8" stroke-width="1.2"/><rect x="30" y="92" width="6" height="56" rx="3" fill="#3886ad"/><text x="147.0" y="116.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#18344b">JavaScript</text><text x="147.0" y="141.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#546573">do 4 pokušaja</text><rect x="301" y="75" width="238" height="100" rx="14" fill="#24445c" opacity=".035"/><rect x="300" y="70" width="240" height="100" rx="14" fill="#f8fbfd" stroke="#c6dbe8" stroke-width="1.2"/><rect x="310" y="92" width="6" height="56" rx="3" fill="#3886ad"/><text x="427.0" y="116.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#18344b">Frontend</text><text x="427.0" y="141.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#546573">do 4 × 4 = 16</text><path d="M 264 120 L 296 120" fill="none" stroke="#3886ad" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><rect x="581" y="75" width="238" height="100" rx="14" fill="#24445c" opacity=".035"/><rect x="580" y="70" width="240" height="100" rx="14" fill="#f8fbfd" stroke="#c6dbe8" stroke-width="1.2"/><rect x="590" y="92" width="6" height="56" rx="3" fill="#3886ad"/><text x="707.0" y="116.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#18344b">Backend</text><text x="707.0" y="141.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#546573">do 4 × 16 = 64</text><path d="M 544 120 L 576 120" fill="none" stroke="#3886ad" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><rect x="861" y="75" width="238" height="100" rx="14" fill="#24445c" opacity=".035"/><rect x="860" y="70" width="240" height="100" rx="14" fill="#fdf3f3" stroke="#e3b9bc" stroke-width="1.2"/><rect x="870" y="92" width="6" height="56" rx="3" fill="#b33e44"/><text x="987.0" y="116.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#18344b">Baza</text><text x="987.0" y="141.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#b33e44">do 64 pokušaja</text><path d="M 824 120 L 856 120" fill="none" stroke="#b33e44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-red)"/><rect x="60" y="210" width="1000" height="110" rx="12" fill="#f8fbfd" stroke="#c6dbe8" stroke-width="2"/><text x="90" y="250" text-anchor="start" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#18344b">Jedna radnja korisnika: do 4 × 4 × 4 = 64 pokušaja na bazi.</text><text x="90" y="290" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#18344b">Baza je preopterećena upravo onda kad bi trebala odgovoriti. Ponavljajte na jednom mjestu.</text></svg>