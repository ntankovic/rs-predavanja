<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="310" viewBox="0 0 1040 310"><text x="22" y="31" text-anchor="start" font-family="Arial,sans-serif" font-size="24" fill="#18344b" font-weight="700">Primjer: predaja u petak → obrana najranije u srijedu</text><rect x="22" y="61" width="151" height="151" rx="14" fill="#dfedf5"/><text x="38" y="91" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#18344b" font-weight="700">PET</text><text x="38" y="148" text-anchor="start" font-family="Arial,sans-serif" font-size="24" fill="#18344b" font-weight="700">PREDAJA</text><text x="38" y="190" text-anchor="start" font-family="Arial,sans-serif" font-size="17" fill="#18344b" font-weight="400">predaja projekta</text><rect x="191" y="61" width="151" height="151" rx="14" fill="#f0f1f3"/><text x="207" y="91" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#18344b" font-weight="700">SUB</text><text x="207" y="148" text-anchor="start" font-family="Arial,sans-serif" font-size="34" fill="#18344b" font-weight="700">—</text><text x="207" y="190" text-anchor="start" font-family="Arial,sans-serif" font-size="17" fill="#18344b" font-weight="400">ne broji se</text><rect x="360" y="61" width="151" height="151" rx="14" fill="#f0f1f3"/><text x="376" y="91" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#18344b" font-weight="700">NED</text><text x="376" y="148" text-anchor="start" font-family="Arial,sans-serif" font-size="34" fill="#18344b" font-weight="700">—</text><text x="376" y="190" text-anchor="start" font-family="Arial,sans-serif" font-size="17" fill="#18344b" font-weight="400">ne broji se</text><rect x="529" y="61" width="151" height="151" rx="14" fill="#e7f2eb"/><text x="545" y="91" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#18344b" font-weight="700">PON</text><text x="545" y="148" text-anchor="start" font-family="Arial,sans-serif" font-size="34" fill="#18344b" font-weight="700">1</text><text x="545" y="190" text-anchor="start" font-family="Arial,sans-serif" font-size="17" fill="#18344b" font-weight="400">radni dan</text><rect x="698" y="61" width="151" height="151" rx="14" fill="#e7f2eb"/><text x="714" y="91" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#18344b" font-weight="700">UTO</text><text x="714" y="148" text-anchor="start" font-family="Arial,sans-serif" font-size="34" fill="#18344b" font-weight="700">2</text><text x="714" y="190" text-anchor="start" font-family="Arial,sans-serif" font-size="17" fill="#18344b" font-weight="400">radni dan</text><rect x="867" y="61" width="151" height="151" rx="14" fill="#dfedf5"/><text x="883" y="91" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#18344b" font-weight="700">SRI</text><text x="883" y="148" text-anchor="start" font-family="Arial,sans-serif" font-size="34" fill="#18344b" font-weight="700">3</text><text x="883" y="190" text-anchor="start" font-family="Arial,sans-serif" font-size="17" fill="#18344b" font-weight="400">obrana</text><text x="22" y="253" text-anchor="start" font-family="Arial,sans-serif" font-size="22" fill="#18344b" font-weight="400">Brojimo od predaje: ponedjeljak 1 → utorak 2 → srijeda 3.</text><text x="22" y="287" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#637585" font-weight="400">Subotu i nedjelju preskačemo. Primjer je bez blagdana.</text></svg>