<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="310" viewBox="0 0 1040 310"><text x="22" y="31" text-anchor="start" font-family="Arial,sans-serif" font-size="24" fill="#18344b" font-weight="700">Example: Friday submission → defence on Wednesday at the earliest</text><rect x="22" y="61" width="151" height="151" rx="14" fill="#dfedf5"/><text x="38" y="91" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#18344b" font-weight="700">FRI</text><text x="38" y="148" text-anchor="start" font-family="Arial,sans-serif" font-size="24" fill="#18344b" font-weight="700">SUBMIT</text><text x="38" y="190" text-anchor="start" font-family="Arial,sans-serif" font-size="17" fill="#18344b" font-weight="400">project submitted</text><rect x="191" y="61" width="151" height="151" rx="14" fill="#f0f1f3"/><text x="207" y="91" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#18344b" font-weight="700">SAT</text><text x="207" y="148" text-anchor="start" font-family="Arial,sans-serif" font-size="34" fill="#18344b" font-weight="700">—</text><text x="207" y="190" text-anchor="start" font-family="Arial,sans-serif" font-size="17" fill="#18344b" font-weight="400">not counted</text><rect x="360" y="61" width="151" height="151" rx="14" fill="#f0f1f3"/><text x="376" y="91" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#18344b" font-weight="700">SUN</text><text x="376" y="148" text-anchor="start" font-family="Arial,sans-serif" font-size="34" fill="#18344b" font-weight="700">—</text><text x="376" y="190" text-anchor="start" font-family="Arial,sans-serif" font-size="17" fill="#18344b" font-weight="400">not counted</text><rect x="529" y="61" width="151" height="151" rx="14" fill="#e7f2eb"/><text x="545" y="91" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#18344b" font-weight="700">MON</text><text x="545" y="148" text-anchor="start" font-family="Arial,sans-serif" font-size="34" fill="#18344b" font-weight="700">1</text><text x="545" y="190" text-anchor="start" font-family="Arial,sans-serif" font-size="17" fill="#18344b" font-weight="400">working day</text><rect x="698" y="61" width="151" height="151" rx="14" fill="#e7f2eb"/><text x="714" y="91" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#18344b" font-weight="700">TUE</text><text x="714" y="148" text-anchor="start" font-family="Arial,sans-serif" font-size="34" fill="#18344b" font-weight="700">2</text><text x="714" y="190" text-anchor="start" font-family="Arial,sans-serif" font-size="17" fill="#18344b" font-weight="400">working day</text><rect x="867" y="61" width="151" height="151" rx="14" fill="#dfedf5"/><text x="883" y="91" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#18344b" font-weight="700">WED</text><text x="883" y="148" text-anchor="start" font-family="Arial,sans-serif" font-size="34" fill="#18344b" font-weight="700">3</text><text x="883" y="190" text-anchor="start" font-family="Arial,sans-serif" font-size="17" fill="#18344b" font-weight="400">defence</text><text x="22" y="253" text-anchor="start" font-family="Arial,sans-serif" font-size="22" fill="#18344b" font-weight="400">Count from submission: Monday 1 → Tuesday 2 → Wednesday 3.</text><text x="22" y="287" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#637585" font-weight="400">Saturday and Sunday are skipped. The example has no public holidays.</text></svg>