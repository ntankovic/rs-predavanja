<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="350" viewBox="0 0 1120 350">
<defs><marker id="time" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#617886"/></marker></defs>
<rect width="1120" height="350" fill="white"/>
<text x="24" y="60" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#18344b">Worker</text>
<rect x="190" y="20" width="190" height="62" rx="10" fill="#e6f6fd" stroke="#1585b4" stroke-width="1.5"/>
<text x="285.0" y="61" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#18344b">A1</text>
<rect x="430" y="20" width="190" height="62" rx="10" fill="#fff0dc" stroke="#b56a21" stroke-width="1.5"/>
<text x="525.0" y="61" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#18344b">B1</text>
<rect x="670" y="20" width="190" height="62" rx="10" fill="#e6f6fd" stroke="#1585b4" stroke-width="1.5"/>
<text x="765.0" y="61" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#18344b">A2</text>
<rect x="910" y="20" width="190" height="62" rx="10" fill="#fff0dc" stroke="#b56a21" stroke-width="1.5"/>
<text x="1005.0" y="61" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#18344b">B2</text>
<line x1="405.0" y1="12" x2="405.0" y2="112" stroke="#1585b4" stroke-width="2.5" stroke-dasharray="6 5"/>
<circle cx="405.0" cy="132" r="17" fill="#1585b4"/>
<text x="405.0" y="140" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="white">1</text>
<text x="405.0" y="182" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#18344b">A waits for storage</text>
<text x="405.0" y="208" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="400" text-anchor="middle" fill="#617886">await storage.save()</text>
<line x1="645.0" y1="12" x2="645.0" y2="112" stroke="#b33e44" stroke-width="2.5"/>
<circle cx="645.0" cy="132" r="17" fill="#b33e44"/>
<text x="645.0" y="140" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="white">2</text>
<text x="645.0" y="182" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#18344b">OS preempts the thread</text>
<text x="645.0" y="208" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#617886">time slice expired</text>
<line x1="885.0" y1="12" x2="885.0" y2="112" stroke="#1585b4" stroke-width="2.5" stroke-dasharray="6 5"/>
<circle cx="885.0" cy="132" r="17" fill="#1585b4"/>
<text x="885.0" y="140" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="white">3</text>
<text x="885.0" y="182" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#18344b">A yields without I/O</text>
<text x="885.0" y="208" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="400" text-anchor="middle" fill="#617886">await asyncio.sleep(0)</text>
<path d="M190 227H1100" stroke="#617886" stroke-width="2" marker-end="url(#time)"/>
<text x="1100" y="250" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="end" fill="#617886">Time</text>
<rect x="40" y="268" width="500" height="68" rx="12" fill="#f8fbfd" stroke="#c6dbe8" stroke-width="1.2"/>
<rect x="50" y="282" width="6" height="40" rx="3" fill="#1585b4"/>
<text x="70" y="296" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#18344b">Cooperative (asyncio)</text>
<text x="70" y="322" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#617886">only at await: ① and ③</text>
<rect x="580" y="268" width="500" height="68" rx="12" fill="#f8fbfd" stroke="#c6dbe8" stroke-width="1.2"/>
<rect x="590" y="282" width="6" height="40" rx="3" fill="#b33e44"/>
<text x="610" y="296" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#18344b">Preemptive (OS threads)</text>
<text x="610" y="322" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#617886">between any two instructions: ②</text>
</svg>