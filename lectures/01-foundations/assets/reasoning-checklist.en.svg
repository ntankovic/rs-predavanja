<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470"><rect width="1120" height="470" fill="white"/><rect x="8" y="10" width="1104" height="82" rx="14" fill="#f1f7fb"/><g transform="translate(24 20)" fill="none" stroke="#3987b4" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><rect x="4" y="20" width="20" height="18" rx="4"/><rect x="48" y="3" width="20" height="18" rx="4"/><rect x="48" y="40" width="20" height="18" rx="4"/><path d="M24 29H35V12H48M35 29V49H48"/></g><text x="123" y="41" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#20364c">Participants</text><text x="123" y="71" font-family="Arial,sans-serif" font-size="22" fill="#536c7b">Identify processes, local state, and messages.</text><rect x="8" y="102" width="1104" height="82" rx="14" fill="#fff8ee"/><g transform="translate(24 112)" fill="none" stroke="#b77c30" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M36 7V55M12 55H60M7 20H65M14 20L3 42H25ZM58 20L47 42H69Z"/><circle cx="36" cy="11" r="5"/></g><text x="123" y="133" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#20364c">Benefit and cost</text><text x="123" y="163" font-family="Arial,sans-serif" font-size="22" fill="#536c7b">Why distribute? What do we gain and pay for?</text><rect x="8" y="194" width="1104" height="82" rx="14" fill="#f1f7fb"/><g transform="translate(24 204)" fill="none" stroke="#3987b4" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><rect x="3" y="10" width="25" height="35" rx="5"/><rect x="45" y="10" width="25" height="35" rx="5"/><path d="M28 27H34M40 27H45M32 48L43 59M43 48L32 59"/></g><text x="123" y="225" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#20364c">Possible failures</text><text x="123" y="255" font-family="Arial,sans-serif" font-size="22" fill="#536c7b">What can stop? Which outcomes remain unknown?</text><rect x="8" y="286" width="1104" height="82" rx="14" fill="#fff8ee"/><g transform="translate(24 296)" fill="none" stroke="#b77c30" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M36 3L62 13V31Q60 49 36 62Q12 49 10 31V13ZM24 31L33 40L49 23"/></g><text x="123" y="317" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#20364c">Assumptions and invariant</text><text x="123" y="347" font-family="Arial,sans-serif" font-size="22" fill="#536c7b">State the model and the rule that must always hold.</text><rect x="8" y="378" width="1104" height="82" rx="14" fill="#f1f7fb"/><g transform="translate(24 388)" fill="none" stroke="#3987b4" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M8 52H22V39H37V24H53V10H66M54 4L66 10L60 22"/><circle cx="8" cy="52" r="4"/></g><text x="123" y="409" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#20364c">Conditions for progress</text><text x="123" y="439" font-family="Arial,sans-serif" font-size="22" fill="#536c7b">What must eventually happen, and under what conditions?</text></svg>
