<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300">
<title>Client and server roles across tiers</title>
<desc>The browser calls the submission service, which calls the assignment service. The middle service is both a server to the browser and a client of the assignment service. Each caller can set its own waiting deadline.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1585b4"/></marker></defs>
<rect width="1120" height="300" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#18344b">
<rect x="15" y="65" width="240" height="120" rx="14" fill="#edf7fc" stroke="#aacbde"/>
<rect x="415" y="65" width="290" height="120" rx="14" fill="#edf7fc" stroke="#aacbde"/>
<rect x="865" y="65" width="240" height="120" rx="14" fill="#edf7fc" stroke="#aacbde"/>
<text x="135" y="108" font-size="27" font-weight="700">Browser</text>
<text x="135" y="153" font-size="23">Client</text>
<text x="560" y="108" font-size="27" font-weight="700">Submission service</text>
<text x="560" y="145" font-size="22">Server to the browser</text>
<text x="560" y="172" font-size="22">Client of the next service</text>
<text x="985" y="108" font-size="25" font-weight="700">Assignment service</text>
<text x="985" y="153" font-size="23">Server</text>
<path d="M255 122H408" stroke="#1585b4" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M705 122H858" stroke="#1585b4" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="335" y="98" font-size="20">Submit</text><text x="785" y="98" font-size="20">Check rules</text>
<path d="M135 197V218H560V197 M560 237V258H985V237" fill="none" stroke="#8c72ae" stroke-width="2"/>
<text x="345" y="248" font-size="21" fill="#655080">Browser's waiting deadline</text>
<text x="790" y="289" font-size="21" fill="#655080">Submission service's waiting deadline</text>
<text x="560" y="30" font-size="21" fill="#617886">Arrows show requests. Replies travel back and are omitted.</text>
</g></svg>
