# Serve the committed Croatian slide decks (output/hr/slides/) as the GitHub Pages site root.
name: Publish slides

on:
  push:
    branches: [main]
    paths:
      - "output/hr/slides/**"
      - "output/hr/lectures/**"
      - "lectures/*/slides.hr.qmd"
      - "lectures/*/timing.json"
      - "scripts/build_pages_index.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Serve each deck under its full name and a short alias, e.g. 01-foundations.html and 01.html.
      - name: Stage decks
        run: |
          mkdir _site
          for f in output/hr/slides/*.html; do
            name=$(basename "$f")
            cp "$f" "_site/$name"
            cp "$f" "_site/${name%%-*}.html"
          done
          mkdir _site/pdf
          cp output/hr/lectures/*.pdf _site/pdf/ 2>/dev/null || true
          cp assets/shared/fipu-logo.svg _site/
          python3 scripts/build_pages_index.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
