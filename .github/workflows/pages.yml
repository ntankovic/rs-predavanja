# Serve the committed Croatian slide decks (output/hr/slides/) as the GitHub Pages site root.
name: Publish slides

on:
  push:
    branches: [main]
    paths: ["output/hr/slides/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output/hr/slides
      - id: deployment
        uses: actions/deploy-pages@v4
