# Serve the committed Croatian slide decks (output/hr/slides/) as the GitHub Pages site root.
name: Publish slides

on:
  push:
    branches: [main]
    paths: ["output/hr/slides/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Serve each deck under its full name and a short alias, e.g. 01-foundations.html and 01.html.
      - name: Stage decks
        run: |
          mkdir _site
          for f in output/hr/slides/*.html; do
            name=$(basename "$f")
            cp "$f" "_site/$name"
            cp "$f" "_site/${name%%-*}.html"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
